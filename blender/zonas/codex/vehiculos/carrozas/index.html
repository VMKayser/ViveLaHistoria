<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visor 3D de dos carruajes coloniales y el caballo de tiro ROME de Mi Ciudad.">
  <title>Carruajes de Sucre · Mi Ciudad</title>
  <style>
    :root { color-scheme: light; --papel:#f8f0e5; --tinta:#332924; --suave:#705e51; --linea:#d8c5af; --azul:#234657; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px system-ui, sans-serif; color: var(--tinta); background:var(--papel); }
    main { max-width: 1500px; margin: auto; padding: clamp(15px,4vw,56px); }
    header { display:flex; justify-content:space-between; align-items:end; gap:12px; margin-bottom:24px; flex-wrap: wrap; }
    .marca { font-size:12px; font-weight:650; letter-spacing:.12em; color:var(--suave); text-transform:uppercase; margin:0 0 5px; }
    h1 { font: 500 clamp(36px,6vw,73px)/.99 Georgia,serif; letter-spacing:-.055em; margin:0; }
    button, a { color:inherit; }
    button, select { font:inherit; cursor:pointer; border:1px solid var(--linea); background:#fcf6ee; border-radius:4px; min-height:43px; padding:7px 13px; }
    select { color:var(--tinta); max-width:100%; }
    button[aria-pressed="true"] { background:var(--azul); color:#fff9f0; border-color:var(--azul); }
    button:hover:not([aria-pressed="true"]) { background:#ecdfd0; }
    button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--azul); outline-offset:3px; }
    nav, .botones { display:flex; flex-wrap:wrap; gap:6px; }
    .estudio { display:grid; grid-template-columns:minmax(0,1fr) 254px; border:1px solid var(--linea); }
    .visibilidad { min-width:0; position:relative; background:#e7d6c3; }
    #lienzo { height:clamp(400px,65vh,790px); }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    #estado { position:absolute; bottom:11px; left:12px; max-width:calc(100% - 24px); padding:6px 9px; border-radius:3px; background:#f8eee3eb; color:#544338; font-size:12px; pointer-events:none; }
    aside { padding:21px; background:#fdf7f0; display:grid; gap:20px; align-content:start; border-left:1px solid var(--linea); }
    .grupo { display:grid; gap:8px; }
    .rotulo { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.065em; color:var(--suave); }
    .grupo output { display:block; margin-top:-3px; color:var(--suave); font-size:12px; min-height:1.2em; }
    input { accent-color:var(--azul); }
    input[type=checkbox] { width:18px; height:18px; margin:0; }
    .marca-caballo { display:flex; align-items:center; gap:9px; }
    footer { display:flex; flex-wrap:wrap; margin-top:13px; gap:10px 18px; color:var(--suave); }
    [hidden] { display:none !important; }
    @media(max-width:820px) {
      main { padding:15px; }
      header { margin-bottom:15px; }
      .estudio { grid-template-columns:1fr; }
      #lienzo { height:clamp(290px,45svh,520px); }
      aside { border-left:0; border-top:1px solid var(--linea); display:flex; flex-wrap:wrap; gap:15px 25px; padding:15px; }
      button { padding-inline:10px; }
    }
  </style>
  <script src="visor.bundle.js" defer></script>
</head>
<body>
<main>
  <header>
    <div><p class="marca">Mi Ciudad · Sucre</p><h1>Carruajes coloniales</h1></div>
    <nav aria-label="Modelos" id="modelos">
      <button type="button" data-modelo="carroza_azul" aria-pressed="true">Carroza azul</button>
      <button type="button" data-modelo="carruaje_madera" aria-pressed="false">Carruaje de madera</button>
      <button type="button" data-modelo="caballo_rome" aria-pressed="false">Caballo ROME</button>
    </nav>
  </header>
  <div class="estudio">
    <div class="visibilidad">
      <div id="lienzo" aria-label="Visor tridimensional"></div>
      <div id="estado" role="status">Cargando modelo…</div>
    </div>
    <aside aria-label="Controles del visor">
      <label class="marca-caballo" id="opcion-caballo"><input type="checkbox" id="enganchar" checked> Caballo enganchado</label>
      <div class="grupo" id="opcion-pelaje">
        <label class="rotulo" for="pelaje">Pelaje del caballo</label>
        <select id="pelaje"></select>
      </div>
      <div class="grupo">
        <span class="rotulo">Marcha</span>
        <div class="botones" id="marcha" aria-label="Marcha">
          <button type="button" data-marcha="reposo" aria-pressed="true">Reposo</button>
          <button type="button" data-marcha="paso" aria-pressed="false">Paso</button>
          <button type="button" data-marcha="galope" aria-pressed="false">Galope</button>
          <button type="button" data-marcha="retroceso" aria-pressed="false">Reversa</button>
        </div>
      </div>
      <div class="grupo" id="opcion-giro">
        <label class="rotulo" for="giro">Dirección</label>
        <input type="range" id="giro" min="-100" max="100" value="0">
        <output for="giro" id="angulo">Recto</output>
      </div>
      <div class="grupo">
        <span class="rotulo">Vista</span>
        <div class="botones" id="vistas" aria-label="Vistas">
          <button type="button" data-vista="tresCuartos" aria-pressed="true">Tres cuartos</button>
          <button type="button" data-vista="lateral" aria-pressed="false">Lateral</button>
          <button type="button" data-vista="peaton" aria-pressed="false">A pie</button>
        </div>
      </div>
    </aside>
  </div>
  <footer>
    <a id="glb" href="carroza_azul.glb" download>GLB</a>
    <a id="blend" href="carroza_azul.blend" download>Archivo Blender</a>
    <a href="INTEGRACION.md">Integración</a>
    <a href="ROME-ATRIBUCION.md">Créditos del caballo</a>
  </footer>
</main>
</body>
</html>
