<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vehículos · Mi Ciudad</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e1df;color:#382d31;font:15px system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column}header{padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff9f0;border-bottom:1px solid #d4c9c4}header strong{font:600 22px Georgia}select,button,a.control{border:1px solid #c8b8ae;background:#fffaf2;color:inherit;border-radius:9px;padding:9px 12px;font:inherit;cursor:pointer}select{max-width:100%}button:hover,a.control:hover{background:#f0e1d3}button[aria-pressed=true],button[data-activo=true]{background:#8e4543;color:#fff}button:disabled{opacity:.5;cursor:wait}a{color:#804238}.escena{position:relative;flex:1;min-height:160px}canvas{width:100%;height:100%;display:block;touch-action:none}.estado{position:absolute;left:15px;top:12px;background:#fff7eeeb;border-radius:9px;padding:8px 12px;pointer-events:none;max-width:calc(100% - 30px)}.estado small{display:block;margin-top:3px}footer{background:#fff9f0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grupo{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.vistas{padding:8px 16px;background:#f5ede6;display:flex;gap:6px;flex-wrap:wrap}.mandos{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.mandos button{height:42px;padding:4px;touch-action:none;user-select:none}.mandos button:first-child{grid-column:2}.mandos button:nth-child(2){grid-column:1}.mandos button:last-child{grid-column:2}output{font-variant-numeric:tabular-nums;font-weight:600}dialog{border:0;border-radius:12px;padding:12px;background:#fff9f0;max-width:96vw;max-height:96dvh}dialog::backdrop{background:#282333bb}dialog img{display:block;max-width:88vw;max-height:78dvh;object-fit:contain}dialog button{margin-bottom:8px}.ayuda{font-size:12px;color:#6e6167}input[type=range]{width:110px;accent-color:#8e4543}@media(max-width:600px){header{padding:8px;gap:6px}header strong{font-size:18px}select{width:100%;font-size:14px}.vistas{padding:6px}.vistas button{font-size:12px;padding:7px}footer{padding:7px;gap:5px}.grupo{gap:5px}.control,footer button{font-size:12px!important;padding:8px!important}.ayuda{display:none}.mandos{grid-template-columns:repeat(3,42px)}.mandos button{height:36px}.estado{font-size:12px}}
</style>
<main>
<header><strong>Vehículos de Mi Ciudad</strong><select id="vehiculo" aria-label="Elegir vehículo"></select><a href="../index.html">Autobús BRONCO</a></header>
<div class="escena"><canvas aria-label="Modelo 3D del vehículo seleccionado"></canvas><div class="estado"><span id="estado">Cargando vehículo…</span><small><output id="velocidad">0,0 km/h</output></small></div></div>
<div class="vistas" aria-label="Vistas"><button data-vista="perspectiva">Perspectiva</button><button data-vista="frente">Frente</button><button data-vista="lateral">Perfil</button><button data-vista="trasera">Trasera</button><button data-vista="peaton">A pie</button><button data-vista="rueda">Rueda</button><button id="malla" aria-pressed="false">Malla</button><button id="referencia">Ver diseño</button></div>
<footer><div><div class="grupo"><button id="probar" data-conduccion disabled aria-pressed="false">Probar marcha</button><button id="frenar" data-conduccion disabled>Frenar</button><button id="reiniciar" data-conduccion disabled>Reiniciar</button></div><div class="grupo"><label for="rapidez">Velocidad</label><input id="rapidez" type="range" min="3" max="30" step="1" value="10"><output id="rapidez-texto">10 km/h</output></div><p class="ayuda">Arrastra para mirar · rueda para acercar · W/A/S/D o flechas para conducir · espacio frena</p><div class="grupo"><a class="control" id="descargar-glb" download>Descargar GLB</a><a class="control" id="descargar-blend" download>Descargar Blender</a><a href="INTEGRACION.md">Integración</a></div></div><div class="mandos" aria-label="Conducción"><button data-mando="adelante" data-conduccion disabled aria-label="Avanzar">▲</button><button data-mando="izquierda" data-conduccion disabled aria-label="Girar a la izquierda">◀</button><button data-mando="derecha" data-conduccion disabled aria-label="Girar a la derecha">▶</button><button data-mando="atras" data-conduccion disabled aria-label="Retroceder">▼</button></div></footer>
</main>
<dialog id="diseno"><button id="cerrar-diseno">Cerrar diseño</button><img id="imagen-diseno" alt="Diseño del vehículo en cuatro vistas"></dialog>
<script src="visor.bundle.js" defer></script>
</html>
